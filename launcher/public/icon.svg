<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The launcher's own icon: a checkered flag on the game's orange gradient. No game art. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc800"/>
      <stop offset="1" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#g)" stroke="#000" stroke-width="24"/>
  <g transform="translate(120 112) skewY(-8)">
    <rect x="0" y="0" width="272" height="204" fill="#fff" stroke="#000" stroke-width="16"/>
    <g fill="#000">
      <rect x="0" y="0" width="68" height="68"/><rect x="136" y="0" width="68" height="68"/>
      <rect x="68" y="68" width="68" height="68"/><rect x="204" y="68" width="68" height="68"/>
      <rect x="0" y="136" width="68" height="68"/><rect x="136" y="136" width="68" height="68"/>
    </g>
  </g>
  <rect x="96" y="96" width="28" height="330" rx="10" fill="#000"/>
</svg>
